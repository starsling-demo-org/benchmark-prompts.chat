name: CI

on:
  # bench-only: run on each PR into starsling/develop; no push trigger.
  pull_request:
    branches:
      - starsling/develop

env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/test"

jobs:
  test:
    name: Test
    runs-on: starsling-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
